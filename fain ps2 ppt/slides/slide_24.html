<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>FAIN — Thank You</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
  .closing-stage {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    text-align: center;
  }
  .closing-eyebrow {
    font-family: var(--font-heading);
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 28px;
    display: flex; align-items: center; gap: 14px;
  }
  .closing-eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 10px var(--primary);
  }
  .thank-you {
    font-family: var(--font-heading);
    font-weight: 800;
    font-size: 130px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--text);
    text-shadow: 0 0 40px rgba(16, 185, 129, 0.20);
    margin: 0 0 18px 0;
  }
  .thank-you .accent {
    background: linear-gradient(135deg, var(--primary-2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .closing-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.7;
    letter-spacing: 0.04em;
  }
  .closing-subtitle .lead {
    color: var(--accent);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.06em;
    display: block;
    margin-bottom: 4px;
  }
  .leaf {
    position: absolute;
    color: rgba(16, 185, 129, 0.08);
    pointer-events: none;
  }
  .leaf .material-icons { font-size: 220px; }
  .leaf-tr { top: -40px; right: -30px; transform: rotate(-20deg); }
  .leaf-bl { bottom: -50px; left: -30px; transform: rotate(160deg); }

  .lora-motif {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 22px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(45, 212, 191, 0.08);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .lora-motif .material-icons { font-size: 14px; }

  .soundwave-large {
    display: flex; align-items: center; gap: 4px; height: 36px;
    margin: 8px 0 24px 0;
    justify-content: center;
  }
  .soundwave-large span {
    width: 4px; border-radius: 2px;
    background: linear-gradient(180deg, var(--accent), var(--primary));
    animation: pulse-large 1.6s ease-in-out infinite;
  }
  @keyframes pulse-large { 0%,100%{ height: 8px;} 50%{ height: 36px;} }

  .glow-ring {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    border: 1px solid rgba(45, 212, 191, 0.08);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .glow-ring.inner { width: 420px; height: 420px; border-color: rgba(16, 185, 129, 0.10); }
</style>
</head>
<body>
<div class="slide">
  <span class="material-icons leaf leaf-tr" data-decor>park</span>
  <span class="material-icons leaf leaf-bl" data-decor>forest</span>
  <div class="glow-ring" data-decor></div>
  <div class="glow-ring inner" data-decor></div>

  <div class="closing-stage">
    <div class="closing-eyebrow">
      <span class="dot"></span>
      <span>FAIN • Progress Seminar</span>
      <span class="dot"></span>
    </div>

    <div class="soundwave-large" data-decor>
      <span style="animation-delay:0s"></span>
      <span style="animation-delay:.1s"></span>
      <span style="animation-delay:.2s"></span>
      <span style="animation-delay:.3s"></span>
      <span style="animation-delay:.4s"></span>
      <span style="animation-delay:.5s"></span>
      <span style="animation-delay:.4s"></span>
      <span style="animation-delay:.3s"></span>
      <span style="animation-delay:.2s"></span>
      <span style="animation-delay:.1s"></span>
      <span style="animation-delay:0s"></span>
    </div>

    <h1 class="thank-you">Thank You <span class="accent">!</span></h1>

    <div class="closing-subtitle">
      <span class="lead">Forest Acoustic Intelligence Network</span>
      Department of Electronics and Telecommunication Engineering<br>
      Don Bosco Institute of Technology, Mumbai
    </div>

    <div class="lora-motif">
      <span class="material-icons">wifi_tethering</span>
      <span>LoRaWAN • IN865 • Edge AI</span>
    </div>
  </div>

  <div class="footer">
    <div class="brand"><span class="dot"></span><span>FAIN • Progress Seminar</span></div>
    <div class="num">24 / 24</div>
  </div>
</div>
</body></html>
